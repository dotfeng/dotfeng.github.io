<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面不存在 · fengg.net</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--ink:#1c2024;--ink-2:#4b5563;--ink-3:#667180;--line:#e5e8ec;--brand:#1a6fd4;--brand-on:#fff;--shadow:0 10px 34px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1318;--card:#161b22;--ink:#e6edf3;--ink-2:#adb7c2;--ink-3:#8b959f;--line:#242c36;--brand:#4f9bf0;--brand-on:#0b1220;--shadow:0 12px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
  background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.box{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px 32px 30px;text-align:center}
.code{font:700 52px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--brand);letter-spacing:2px;margin:0 0 10px}
h1{font-size:20px;margin:0 0 10px}
p{color:var(--ink-2);font-size:14.5px;margin:0 0 22px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;text-decoration:none;transition:.15s}
a.p{background:var(--brand);color:var(--brand-on)}
a.g{border-color:var(--line);color:var(--ink-2)}
a.g:hover{border-color:var(--brand);color:var(--brand)}
a:hover{opacity:.92}
</style>
</head>
<body>
<div class="box">
  <p class="code">404</p>
  <h1>这个页面不在了</h1>
  <p>链接可能已经变动。题库里的试题都在 t.fengg.net，可以从那边重新找。</p>
  <div class="acts">
    <a class="btn p" href="https://t.fengg.net">进入题库 →</a>
    <a class="btn g" href="/">返回首页</a>
  </div>
</div>
</body>
</html>
