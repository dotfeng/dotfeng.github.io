<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>竞赛资料 · fengg.net</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="天文、数学、物理、生物、化学、地球科学、地理、信息学竞赛资料的入口页；题库在 t.fengg.net。">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1318">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;
  --card:#ffffff;
  --ink:#1c2024;
  --ink-2:#4b5563;
  --ink-3:#667180;
  --line:#e5e8ec;
  --brand:#1a6fd4;
  --brand-ink:#1259ad;
  --brand-on:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 34px rgba(16,24,40,.07);
  --glow-1:#e8f1ff;
  --glow-2:#eef7f1;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0f1318;
    --card:#161b22;
    --ink:#e6edf3;
    --ink-2:#adb7c2;
    --ink-3:#8b959f;
    --line:#242c36;
    --brand:#4f9bf0;
    --brand-ink:#7bb6f5;
    --brand-on:#0b1220;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45);
    --glow-1:#132234;
    --glow-2:#10251f;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  display:flex;flex-direction:column;min-height:100vh;
  background:var(--bg);color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at 12% -8%,var(--glow-1),transparent 70%),
    radial-gradient(560px 380px at 92% 4%,var(--glow-2),transparent 72%);
}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 22px}

main{flex:1 0 auto;display:flex;align-items:center;padding:64px 0 48px}
.card{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:44px 40px 34px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;letter-spacing:2px;color:var(--ink-3);
  text-transform:uppercase;margin:0 0 14px;
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
h1{
  margin:0 0 14px;font-size:clamp(28px,4.4vw,38px);line-height:1.25;letter-spacing:-.4px;
}
h1 em{font-style:normal;color:var(--brand)}
.lead{margin:0 0 28px;font-size:16px;line-height:1.9;color:var(--ink-2);max-width:34em}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 30px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:11px;border:1px solid transparent;
  font-size:15px;font-weight:600;line-height:1.2;
  transition:transform .15s,background .15s,border-color .15s,color .15s;
}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:var(--brand-on);box-shadow:0 6px 18px rgba(26,111,212,.24)}
.btn-primary:hover{background:var(--brand-ink)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn .arr{font-size:15px;line-height:1;transform:translateY(.5px)}
.sub{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 22px;
  margin:0;padding:24px 0 0;border-top:1px solid var(--line);list-style:none;
}
.sub li{font-size:14px;color:var(--ink-3)}
.sub b{display:block;color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:2px}
.note{margin:22px 0 0;font-size:13.5px;color:var(--ink-3)}
footer{padding:0 0 34px;color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
footer .dot{opacity:.5}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}
@media (max-width:560px){
  main{padding:40px 0 32px}
  .card{padding:32px 22px 26px;border-radius:16px}
  .btn{flex:1 1 100%;justify-content:center}
}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="card">
      <p class="eyebrow"><i></i>fengg.net</p>
      <h1>竞赛资料<em>整理与归档</em></h1>
      <p class="lead">
        天文、数学、物理、生物、化学、地球科学、地理、信息学的竞赛真题，按届次整理成可读的网页与原卷，
        配套答案与逐题解析，支持在线阅读、打印与答题自测。
      </p>
      <p class="acts">
        <a class="btn btn-primary" href="https://t.fengg.net">进入题库<span class="arr" aria-hidden="true">→</span></a>
        <a class="btn btn-ghost" href="https://t.fengg.net/whitelist/">白名单竞赛</a>
        <a class="btn btn-ghost" href="https://t.fengg.net/about/">使用说明</a>
      </p>
      <ul class="sub">
        <li><b>题库</b>按学科与赛事浏览全部试题</li>
        <li><b>答题模式</b>选择题在线作答，即时判分</li>
        <li><b>下载</b>原卷 PDF 与 Word 版可打印</li>
      </ul>
      <p class="note">笔记与博客正在整理，之后会陆续补到这里。</p>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>© 2026 Feng</span><span class="dot">·</span>
    <span>Powered by <a href="https://hexo.io/" target="_blank" rel="noopener">Hexo</a></span>
  </div>
</footer>
</body>
</html>
